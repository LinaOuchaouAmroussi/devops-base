name: Tofu Apply 
on: 
  push: 
    branches: ["main"] 
    paths: ["td5/scripts/tofu/live/lambda-sample/**"] 

jobs: 
  apply: 
    name: "Tofu Apply" 
    runs-on: ubuntu-latest 
    permissions: 
      pull-requests: write 
      id-token: write 
      contents: read 
    steps: 
      - name: Checkout repository 
        uses: actions/checkout@v3 

      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v3 
        with:
          role-to-assume: ${{ secrets.APPLY_ROLE_ARN }} 
          role-session-name: apply-${{ github.run_number }}-${{ github.actor }} 
          aws-region: eu-north-1 

      - name: Setup OpenTofu 
        uses: opentofu/setup-opentofu@v1 

      - name: Tofu apply 
        id: apply 
        working-directory: td5/scripts/tofu/live/lambda-sample 
        run: | 
          tofu init -no-color -input=false 
          tofu apply -no-color -input=false -auto-approve